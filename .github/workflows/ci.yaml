name: Build and test (no device deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run APDU parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/hce_protocol_test.cpp -o /tmp/hce_protocol_test
          /tmp/hce_protocol_test
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.9.1
      - name: Validate config without secrets
        run: esphome config examples/tagreader-ci.yaml
      - name: Compile ESP8266 firmware only (no flashing, no OTA)
        run: esphome compile examples/tagreader-ci.yaml
      - name: Validate pinned remote component integration
        run: esphome config examples/tagreader-remote-ci.yaml
      - name: Compile remote component integration (no flashing, no OTA)
        run: esphome compile examples/tagreader-remote-ci.yaml
  prerelease_tag:
    # A one-off experimental source tag; only after the complete Linux CI is green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: publish experimental beta tag'
    needs: [parser, esphome]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create beta Git tag (no GitHub release or device deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPOSITORY}/git/ref/tags/v0.1.0-beta.1" >/dev/null 2>&1; then
            echo "Tag already exists; leaving it untouched."
          else
            gh api --method POST "repos/${REPOSITORY}/git/refs" --field ref="refs/tags/v0.1.0-beta.1" --field sha="${TARGET_SHA}"
          fi
