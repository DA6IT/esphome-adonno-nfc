name: Build and test (no device deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run APDU parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/hce_protocol_test.cpp -o /tmp/hce_protocol_test
          /tmp/hce_protocol_test
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.9.1
      - name: Validate config without secrets
        run: esphome config examples/tagreader-ci.yaml
      - name: Compile ESP8266 firmware only (no flashing, no OTA)
        run: esphome compile examples/tagreader-ci.yaml
