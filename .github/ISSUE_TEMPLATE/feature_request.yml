name: Feature request
description: Suggest a new capability for the Adonno PN532 HCE extension
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the compatibility goal and your available test hardware. Do not include secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature would preserve existing physical card reads.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / ESPHome version (if relevant)
    validations:
      required: false
