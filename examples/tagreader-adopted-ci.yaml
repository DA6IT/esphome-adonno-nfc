# Mirrors the structure of a Device-Builder-adopted Adonno reader (D1 mini,
# ESP8266) on ESPHome 2026.10.x: package import, encrypted API, Wi-Fi from
# secrets and the external component. CI writes throw-away dummy values to
# examples/secrets.yaml (git-ignored); real secrets never belong here.
# Compile-only. NEVER flash this image.
substitutions:
  name: tagreader-ci-adopted
  friendly_name: TagReader CI

packages:
  adonno.tag_reader: github://adonno/tagreader/tagreader.yaml@23c2ebb880577a906c89f9fa90905bafcea4f446

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components
    components: [pn532_i2c]
