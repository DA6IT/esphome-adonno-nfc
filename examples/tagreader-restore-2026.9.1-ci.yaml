# Known-good RESTORE build for ESPHome 2026.9.1 (rollback path).
# Remote component pinned to the hardware-tested 2026.9.1 port, original Adonno
# package unchanged. Compile with `pip install esphome==2026.9.1` only.
# This file has NO private Wi-Fi credentials. Never flash test CI images.
substitutions:
  name: adonno-restore-ci
  friendly_name: Adonno Restore CI

packages:
  adonno.tag_reader: github://adonno/tagreader/tagreader.yaml@a8bb6fc43e5a687503d1b43edb32855d0de7050a

external_components:
  - source: github://DA6IT/esphome-adonno-nfc@f89b5ef7f21067ecf64ed1b2a77bb322b8541df4
    components: [pn532_i2c]

esphome:
  name: ${name}
  name_add_mac_suffix: false
